server:
  port: 8081

spring:
  application:
    name: order-command-service
  datasource:
    url: jdbc:mysql://localhost:3311/order_write_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: rootpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.example.command: DEBUG
    org.hibernate.SQL: DEBUG